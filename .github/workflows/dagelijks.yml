name: Instagram-automaat (dagelijks)

on:
  schedule:
    # Elk uur tussen 05:00 en 19:00 UTC kijkt een snelle 'poort' of het tijd is.
    # De echte run gebeurt één keer per dag, vanaf het uur in de variabele PUBLICATIE_UUR
    # (Nederlandse tijd, standaard 8). Bij een fout volgt het uur erna één herkansing.
    - cron: '0 5-19 * * *'
  workflow_dispatch:
    inputs:
      modus:
        description: 'proef = alles testen zonder te publiceren, live = nu publiceren'
        type: choice
        options: [proef, live]
        default: proef
      auto:
        description: 'Optioneel: voertuig-ID (het nummer achter in de URL, bv. 941609)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: cb-instagram-automaat
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      # zelfde omgeving als de referentieslides: pixel-identieke huisstijl
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble
    env:
      TZ: Europe/Amsterdam
      PIP_BREAK_SYSTEM_PACKAGES: "1"
      PUBLICATIE: ${{ vars.PUBLICATIE }}
      PUBLICATIE_DAGEN: ${{ vars.PUBLICATIE_DAGEN || 'di,vr' }}
      STORY: ${{ vars.STORY || 'uit' }}
      PUBLICATIE_UUR: ${{ vars.PUBLICATIE_UUR || '8' }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_API_HOST: ${{ vars.IG_API_HOST || 'graph.instagram.com' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5-5' }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      RAPPORT_EMAIL: ${{ secrets.RAPPORT_EMAIL }}
    steps:
      - name: git installeren
        run: apt-get update -qq && apt-get install -y -qq git > /dev/null

      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Poort (is het nu tijd?)
        id: poort
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, datetime
          from zoneinfo import ZoneInfo
          if os.environ.get('GITHUB_EVENT_NAME') != 'schedule':
              print('door=ja'); raise SystemExit
          nu = datetime.datetime.now(ZoneInfo('Europe/Amsterdam'))
          uur = int(os.environ.get('PUBLICATIE_UUR') or 8)
          try:
              runs = json.load(open('state/database.json')).get('runs', [])
          except Exception:
              runs = []
          vandaag = [r for r in runs if r.get('modus') == 'dagelijks' and r.get('datum') == nu.strftime('%Y-%m-%d')]
          klaar = any(not r.get('fouten') for r in vandaag) or len(vandaag) >= 2
          print('door=' + ('ja' if nu.hour >= uur and not klaar else 'nee'))
          PY

      - name: Cache (Python-pakketten en herkenningsmodel)
        if: steps.poort.outputs.door == 'ja'
        uses: actions/cache@v4
        with:
          path: |
            /github/home/.cache/pip
            /github/home/.cache/huggingface
          key: cb-cache-v1-${{ hashFiles('requirements.txt') }}

      - name: Voorbereiden
        if: steps.poort.outputs.door == 'ja'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "CB Instagram-automaat"
          git config user.email "automaat@users.noreply.github.com"
          pip install -q -r requirements.txt
          # gratis fotoherkenning (CPU-versie, ~200 MB, wordt gecachet)
          pip install -q --index-url https://download.pytorch.org/whl/cpu torch==2.8.0 torchvision==0.23.0
          pip install -q open_clip_torch==3.2.0

      - name: Automaat draaien
        if: steps.poort.outputs.door == 'ja'
        id: automaat
        run: |
          MODUS="${{ github.event_name == 'schedule' && 'dagelijks' || inputs.modus }}"
          AUTO="${{ inputs.auto }}"
          python -m automaat.run --modus "$MODUS" ${AUTO:+--auto "$AUTO"}

      - name: Database en rapport opslaan
        if: always() && steps.poort.outputs.door == 'ja'
        run: |
          for d in state rapport gepubliceerd proef; do [ -e "$d" ] && git add -A "$d"; done
          if ! git diff --cached --quiet; then
            git commit -q -m "rapport $(date +'%Y-%m-%d %H:%M')"
            for i in 1 2 3 4 5; do git push && break; git pull --rebase -q -X ours; sleep 5; done
          fi

      - name: Slides en caption als download bewaren
        if: always() && steps.poort.outputs.door == 'ja'
        uses: actions/upload-artifact@v4
        with:
          name: slides-${{ github.run_number }}
          path: .werk/uitvoer/
          retention-days: 30
          if-no-files-found: ignore
